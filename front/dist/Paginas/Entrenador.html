<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel socio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/Icons_logo.png">
    <link rel="stylesheet" href="../CSS/entrenador.css">
</head>
<body>
 
<input type="checkbox" id="menuToggle" class="menu-toggle">
<label for="menuToggle" class="hamburger-btn" aria-label="Abrir menú">
  <i class="bi bi-list"></i>
</label>
<label for="menuToggle" class="sidebar-overlay"></label>
 
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../assets/logo_fitpower.jpg" width="130">
  </div>
 
  <nav class="nav-group">
    <a href="#" class="side-link active"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a>
    <a href="#" class="side-link"><i class="bi bi-graph-up-arrow"></i><span>Mis socios</span></a>
    <a href="#" class="side-link"><i class="bi bi-list-check"></i><span>Rutinas</span></a>
    <a href="#" class="side-link"><i class="bi bi-heart-pulse"></i><span>Entrenamientos</span></a>
    <a href="#" class="side-link"><i class="bi bi-calendar-check"></i><span>Ejercicios</span></a>
    <a href="#" class="side-link"><i class="bi bi-card-checklist"></i><span>Agenda</span></a>
    <a href="#" class="side-link"><i class="bi bi-box-seam"></i><span>Mensajes</span></a>
    <a href="#" class="side-link"><i class="bi bi-person-circle"></i><span>Perfil</span></a>
  </nav>
 
  <div class="sidebar-footer">
    <a href="#" class="logout-link"><i class="bi bi-box-arrow-left"></i><span>Cerrar sesión</span></a>
  </div>
</aside>

<main class="main">
  <div class="welcome-header">
    <div>
      <h1>¡Hola Entrenador!</h1>
      <p class="welcome-sub">Resumen entrenamiento</p>
    </div>
  </div>
  <div class="block-heading">Resumen</div>
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label">Socios asignados</div>
        <div class="metric-value">28</div>
        <div class="metric-foot">
          <span>Ver socios asignados →</span>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label">Entrenadmientos de hoy</div>
        <div class="metric-value">6</div>
        <div class="metric-foot">
          <span>Ver agenda →</span>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label">Rutinas creadas</div>
        <div class="metric-value">12</div>
        <div class="metric-foot">
          <span>Ver rutinas →</span>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label">Mensajes nuevos</div>
        <div class="metric-value">3</div>
        <div class="metric-foot">
          <span>Ver mensajes nuevos →</span>
        </div>
      </div>
    </div>
  </div>


 </body>
</html>
