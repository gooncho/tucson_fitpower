<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionar ejercicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../CSS/administrador.css">
  <link rel="stylesheet" href="../../../css/Gestionarsocio.css">
</head>
<body class="admin-body">
<div class="container-fluid">
  <div class="row">
    <div class="row min-vh-100">
    <aside class="admin-sidebar col-md-2 p-3 d-none d-md-block ">
      <img src="../../../assets/logo_fitpower.jpg" class="admin-logo">
      <nav class="nav flex-column">
        <a class="nav-link admin-link" href="inicioAdministrador.html"><i class="bi bi-house"></i>Inicio</a>
        <a class="nav-link admin-link" href="GestionarSocio.html"><i class="bi bi-people"></i>Socios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-card-checklist"></i>Membresías</a>
        <a class="nav-link admin-link" href="GestionarEntrenadores.html"><i class="bi bi-person-badge"></i>Entrenadores</a>
        <a class="nav-link admin-link" href="GestionarProductos.html"><i class="bi bi-bag"></i>Productos</a>
        <a class="nav-link admin-link activo" href="#"><i class="bi bi-activity"></i>Ejercicios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-person-circle"></i>Mi Perfil</a>
        <hr class="admin-sidebar-separador">
        <a href="../../../../index.html" class="nav-link admin-link" id="btnlogout">
            <i class="bi bi-box-arrow-right"></i>Cerrar sesión
        </a> 
      </nav>
    </aside>
 
    <main class="col-md-10 admin-contenido">
      <header class="admin-header">
        <div>
          <h1>Gestionar ejercicios</h1>
          <p>Administrar ejercicios del gimnasio</p>
        </div>
        <a href="admin-ejercicio-form.html" class="admin-btn"><i class="bi bi-plus-lg"></i>Nuevo ejercicio</a>
      </header>
 
      <section class="admin-seccion">
        <div class="admin-herramientas dos">
          <div class="admin-campo">
            <i class="bi bi-search"></i>
            <input type="search" id="buscar" class="admin-input" placeholder="Buscar ejercicio...">
          </div>
          <select id="filtroGrupo" class="admin-select">
            <option value="">Todos los grupos musculares</option>
          </select>
        </div>
 
        <div class="admin-tabla-wrap">
          <table class="admin-tabla">
            <thead>
              <tr><th>Ejercicio</th><th>Grupo muscular</th><th>Dificultad</th><th class="col-acciones">Acciones</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="admin-vacio" id="vacio"></p>
      </section>
    </main>
 
  </div>
</div>
<script src="../../../JS/api.js"></script>
<script src="../../../JS/roles/Administrador/administrador.js"></script>
<script>
  let ejercicios = [];
 
  const grupos = (e) => String(e.grupo_muscular ?? "").split(/[-,\/]/).map(g => g.trim()).filter(Boolean);
 
  function render() {
    const q = norm($("buscar").value.trim());
    const g = $("filtroGrupo").value;
 
    const lista = ejercicios.filter(e =>
      (!q || norm(e.nombre).includes(q)) &&
      (!g || grupos(e).includes(g)));
 
    $("tbody").innerHTML = lista.map(e => `
      <tr>
        <td>
          ${e.imagen
            ? `<img src="${esc(e.imagen)}" alt="" class="admin-ejercicio-img">`
            : `<i class="bi bi-image admin-nulo me-2"></i>`}
          ${esc(e.nombre)}
        </td>
        <td>${esc(e.grupo_muscular)}</td>
        <td><span class="admin-estado ${slug(e.dificultad)}">${esc(e.dificultad)}</span></td>
        <td class="col-acciones">
          <a class="admin-mini" href="admin-ejercicio-detalle.html?id=${encodeURIComponent(e.id_ejercicio)}">Ver</a>
          <a class="admin-mini" href="admin-ejercicio-form.html?id=${encodeURIComponent(e.id_ejercicio)}">Editar</a>
        </td>
      </tr>`).join("");
 
    aviso(lista.length ? "" : (ejercicios.length ? "No hay ejercicios que coincidan con la búsqueda" : "Todavía no hay ejercicios registrados"));
  }
 
  conectar(["buscar", "filtroGrupo"], render);
  API.request('/ejercicios', 'GET').then(d => {
    ejercicios = Array.isArray(d) ? d : (d.data || []);
    llenarSelect("filtroGrupo", ejercicios.flatMap(grupos), "Todos los grupos musculares");
    render();
  }).catch(() => aviso("No se pudo conectar con la API"));
</script>
</body>
</html>
