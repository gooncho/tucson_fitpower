<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../CSS/administrador.css">
  <link rel="stylesheet" href="../../../css/Gestionarsocio.css">
</head>
<body class="admin-body">
<div class="container-fluid">
  <div class="row">
    <div class="row min-vh-100">
    <aside class="admin-sidebar col-md-2 p-3 d-none d-md-block ">
      <img src="../../../assets/logo_fitpower.jpg" class="admin-logo">
      <nav class="nav flex-column">
        <a class="nav-link admin-link" href="inicioAdministrador.html"><i class="bi bi-house"></i>Inicio</a>
        <a class="nav-link admin-link" href="GestionarSocio.html"><i class="bi bi-people"></i>Socios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-card-checklist"></i>Membresías</a>
        <a class="nav-link admin-link" href="GestionarEntrenadores.html"><i class="bi bi-person-badge"></i>Entrenadores</a>
        <a class="nav-link admin-link" href="GestionarProductos.html"><i class="bi bi-bag"></i>Productos</a>
        <a class="nav-link admin-link" href="GestionarEjercicios.html"><i class="bi bi-activity"></i>Ejercicios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-person-circle"></i>Mi Perfil</a>
        <hr class="admin-sidebar-separador">
        <a href="../../../../index.html" class="nav-link admin-link" id="btnLogout">
            <i class="bi bi-box-arrow-right"></i>Cerrar sesión
        </a>
      </nav>
    </aside>

    <main class="col-md-10 admin-contenido">
      <header class="admin-header">
        <div>
          <h1>Pagos</h1>
          <p>Últimos pagos</p>
        </div>
      </header>
 
      <section class="admin-seccion">
        <div class="admin-herramientas">
          <div class="admin-campo">
            <i class="bi bi-search"></i>
            <input type="search" id="buscar" class="admin-input" placeholder="Buscar socio...">
          </div>
          <select id="filtroRazon" class="admin-select">
            <option value="">Todos los pagos</option>
            <option value="Membresía">Membresías</option>
            <option value="Productos">Productos</option>
          </select>
          <select id="filtroEstado" class="admin-select">
            <option value="">Todos los estados</option>
            <option value="Pagada">Pagada</option>
            <option value="Pendiente">Pendiente</option>
          </select>
        </div>
 
        <div class="admin-tabla-wrap">
          <table class="admin-tabla">
            <thead>
              <tr><th>Nombre</th><th>Fecha</th><th>Razón</th><th>Monto</th><th>Estado</th><th class="col-acciones">Acciones</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="admin-vacio" id="vacio"></p>
      </section>
    </main>
 
  </div>
</div>
 
<script src="../../../JS/api.js"></script>
<script src="../../../JS/roles/Administrador/administrador.js"></script>
<script>
  let pagos = [];
 
  function render() {
    const q = norm($("buscar").value.trim());
    const razon = norm($("filtroRazon").value);
    const est = $("filtroEstado").value;
 
    const lista = pagos.filter(p =>
      (!q || norm(p.nombre_usuario).includes(q)) &&
      (!razon || norm(p.razon).startsWith(razon)) &&
      (!est || p.estado === est));
 
    $("tbody").innerHTML = lista.map(p => `
      <tr>
        <td>${esc(p.nombre_usuario)}</td>
        <td>${fecha(p.fecha)}</td>
        <td>${esc(p.razon)}</td>
        <td>${dinero(p.monto)}</td>
        <td><span class="admin-estado ${slug(p.estado)}">${esc(p.estado)}</span></td>
        <td class="col-acciones">
          <a class="admin-mini" href="admin-pago-detalle.html?id=${encodeURIComponent(p.id_pago)}">Ver</a>
          <a class="admin-mini" href="admin-pago-form.html?id=${encodeURIComponent(p.id_pago)}">Editar</a>
        </td>
      </tr>`).join("");
 
    aviso(lista.length ? "" : (pagos.length ? "No hay pagos que coincidan con la búsqueda" : "Todavía no hay pagos registrados"));
  }
 
  conectar(["buscar", "filtroRazon", "filtroEstado"], render);
 
  API.request('/pagos', 'GET').then(d => {
    pagos = Array.isArray(d) ? d : (d.data || []);
    render();
  }).catch(() => aviso("No se pudo conectar con la API"));
</script>
</body>
</html>
