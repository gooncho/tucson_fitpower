<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionar entrenadores</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../CSS/administrador.css">
  <link rel="stylesheet" href="../../../css/Gestionarsocio.css">
</head>
<body class="admin-body">
<div class="container-fluid">
  <div class="row">
    <div class="row min-vh-100">
    <aside class="admin-sidebar col-md-2 p-3 d-none d-md-block ">
      <img src="../../../assets/logo_fitpower.jpg" class="admin-logo">
      <nav class="nav flex-column">
        <a class="nav-link admin-link" href="inicioAdministrador.html"><i class="bi bi-house"></i>Inicio</a>
        <a class="nav-link admin-link" href="GestionarSocio.html"><i class="bi bi-people"></i>Socios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-card-checklist"></i>Membresías</a>
        <a class="nav-link admin-link activo" href="#"><i class="bi bi-person-badge"></i>Entrenadores</a>
        <a class="nav-link admin-link" href="GestionarProductos.html"><i class="bi bi-bag"></i>Productos</a>
        <a class="nav-link admin-link" href="GestionarEjercicios.html"><i class="bi bi-activity"></i>Ejercicios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-person-circle"></i>Mi Perfil</a>
        <hr class="admin-sidebar-separador">
        <a href="../../../../index.html" class="nav-link admin-link" id="btnLogout">
            <i class="bi bi-box-arrow-right"></i>Cerrar sesión
        </a>
      </nav>
    </aside>
 
    <main class="col-md-10 admin-contenido">
      <header class="admin-header">
        <div>
          <h1>Gestionar entrenadores</h1>
          <p>Administrar los entrenadores del gimnasio</p>
        </div>
        <a href="admin-entrenador-form.html" class="admin-btn"><i class="bi bi-plus-lg"></i>Nuevo entrenador</a>
      </header>
 
      <section class="admin-seccion">
        <div class="admin-herramientas">
          <div class="admin-campo">
            <i class="bi bi-search"></i>
            <input type="search" id="buscar" class="admin-input" placeholder="Buscar entrenador...">
          </div>
          <select id="filtroEspecialidad" class="admin-select">
            <option value="">Todas las especialidades</option>
          </select>
          <select id="filtroEstado" class="admin-select">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
 
        <div class="admin-tabla-wrap">
          <table class="admin-tabla">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th class="text-center">Socios asignados</th>
                <th>Horario</th>
                <th>Estado</th>
                <th class="col-acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="admin-vacio" id="vacio"></p>
      </section>
    </main>
 
  </div>
</div>
 
<script src="../../../JS/api.js"></script>
<script src="../../../JS/roles/Administrador/administrador.js"></script>
<script>
  let entrenadores = [];
 
  function render() {
    const q = norm($("buscar").value.trim());
    const esp = $("filtroEspecialidad").value;
    const est = $("filtroEstado").value;
 
    const lista = entrenadores.filter(e =>
      (!q || norm(e.nombre_usuario).includes(q) || norm(e.email).includes(q)) &&
      (!esp || e.especialidad === esp) &&
      (!est || e.estado === est));
 
    $("tbody").innerHTML = lista.map(e => `
      <tr>
        <td>${esc(e.nombre_usuario)}<small class="d-block admin-nulo">${esc(e.email)}</small></td>
        <td>${e.especialidad ? esc(e.especialidad) : '<span class="admin-nulo">—</span>'}</td>
        <td class="text-center">${esc(e.socios_asignados ?? 0)}</td>
        <td>${e.hora_inicio && e.dias
          ? `${esc(e.dias)}<small class="d-block admin-nulo">${esc(e.hora_inicio)} -${esc(e.hora_fin)}</small>`
          : '<span class="admin-nulo">—</span>'}</td>
        <td><span class="admin-estado ${slug(e.estado)}">${esc(e.estado)}</span></td>
        <td class="col-acciones">
          <a class="admin-mini" href="admin-entrenador-detalle.html?id=${encodeURIComponent(e.id_usuario)}">Ver</a>
          <a class="admin-mini" href="admin-entrenador-form.html?id=${encodeURIComponent(e.id_usuario)}">Editar</a>
        </td>
      </tr>`).join("");
 
    aviso(lista.length ? "" : (entrenadores.length
      ? "No hay entrenadores que coincidan con la búsqueda"
      : "Todavía no hay entrenadores registrados"));
  }
 
  conectar(["buscar", "filtroEspecialidad", "filtroEstado"], render);
 
  API.request('/entrenadores', 'GET').then(d => {
    entrenadores = Array.isArray(d) ? d : (d.data || []);
    const esp = [...new Set(entrenadores.map(e => e.especialidad).filter(Boolean))].sort();
    $("filtroEspecialidad").innerHTML = `<option value="">Todas las especialidades</option>` +
      esp.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join("");
    render();
  }).catch(() => aviso("No se pudo conectar con la API"));
</script>
</body>
</html>
