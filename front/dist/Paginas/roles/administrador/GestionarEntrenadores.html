<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionar entrenadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../CSS/administrador.css">
  <link rel="stylesheet" href="../../../css/Gestionarsocio.css">
</head>
<body class="admin-body">
<div class="container-fluid">
  <div class="row">
    <div class="row min-vh-100">
    <aside class="admin-sidebar col-md-2 p-3 d-none d-md-block ">
      <img src="../../../assets/logo_fitpower.jpg" class="admin-logo">
      <nav class="nav flex-column">
        <a class="nav-link admin-link" href="inicioAdministrador.html"><i class="bi bi-house"></i>Inicio</a>
        <a class="nav-link admin-link" href="GestionarSocio.html"><i class="bi bi-people"></i>Socios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-card-checklist"></i>Membresías</a>
        <a class="nav-link admin-link activo" href="#"><i class="bi bi-person-badge"></i>Entrenadores</a>
        <a href="Pagos.html" class="nav-link admin-link"><i class="bi bi-cash-stack"></i>Pagos e ingresos</a>
        <a class="nav-link admin-link" href="GestionarProductos.html"><i class="bi bi-bag"></i>Productos</a>
        <a class="nav-link admin-link" href="GestionarEjercicios.html"><i class="bi bi-activity"></i>Ejercicios</a>
        <a class="nav-link admin-link" href="#"><i class="bi bi-person-circle"></i>Mi Perfil</a>
        <hr class="admin-sidebar-separador">
        <a href="../../../../index.html" class="nav-link admin-link" id="btnLogout">
            <i class="bi bi-box-arrow-right"></i>Cerrar sesión
        </a>
      </nav>
    </aside>
 
    <main class="col-md-10 admin-contenido">
      <header class="admin-header">
        <div>
          <h1>Gestionar entrenadores</h1>
          <p>Administrar los entrenadores del gimnasio</p>
        </div>
        <a href="#" class="admin-btn"><i class="bi bi-plus-lg"></i>Nuevo entrenador</a>
      </header>
 
      <section class="admin-seccion">
        <div class="admin-herramientas">
          <div class="admin-campo">
            <i class="bi bi-search"></i>
            <input type="search" id="buscar" class="admin-input" placeholder="Buscar entrenador...">
          </div>
          <select id="filtroEspecialidad" class="admin-select">
            <option value="">Todas las especialidades</option>
          </select>
          <select id="filtroEstado" class="admin-select">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
 
        <div class="admin-tabla-wrap">
          <table class="admin-tabla">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th class="text-center">Socios asignados</th>
                <th>Horario</th>
                <th>Estado</th>
                <th class="col-acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="admin-vacio" id="vacio"></p>
      </section>
    </main>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../JS/api.js"></script>
<script src="../../../JS/roles/Administrador/administrador.js"></script>
<script src="../../../JS/roles/Administrador/gestionarEntrenadores.js"></script>

<div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: #151515; border: 1px solid #2a2a2a; color: #f4f4f2;">
            <div class="modal-header" style="border-bottom: 1px solid #2a2a2a;">
                <h5 class="modal-title" id="adminModalLabel" style="font-family: 'Montserrat', sans-serif; color: #cdfa3f;">Detalles</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="adminModalBody"></div>
            <div class="modal-footer" style="border-top: 1px solid #2a2a2a;" id="adminModalFooter">
                <button type="button" class="admin-mini" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
