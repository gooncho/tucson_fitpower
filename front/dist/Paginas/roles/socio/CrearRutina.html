  <link rel="icon" href="../../../assets/logo_fitpower.jpg">
  <link rel="stylesheet" href="../../../CSS/dashboard.css">
  <link rel="stylesheet" href="../../../CSS/Socio.css">
</head>

<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger-btn" aria-label="Abrir menú"><i class="bi bi-list"></i></label>
  <label for="menu-toggle" class="sidebar-overlay"></label>
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="../../../assets/logo_fitpower.jpg" width="130" alt="Logo FitPower"></div>
    <nav class="nav-group">
      <a href="inicioSocio.html" class="side-link"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a>
      <a href="miProgreso.html" class="side-link"><i class="bi bi-graph-up-arrow"></i><span>Mi progreso</span></a>
      <a href="Rutinas.html" class="side-link"><i class="bi bi-list-check"></i><span>Rutinas</span></a>
      <a href="Entrenamientos.html" class="side-link"><i class="bi bi-heart-pulse"></i><span>Entrenamientos</span></a>
      <a href="Membresia.html" class="side-link"><i class="bi bi-card-checklist"></i><span>Membresía</span></a>
      <a href="../../Productos.html" class="side-link"><i class="bi bi-box-seam"></i><span>Productos</span></a>
      <a href="MisLogros.html" class="side-link"><i class="bi bi-trophy-fill"></i><span>Mis logros</span></a>
      <a href="Objetivos.html" class="side-link"><i class="bi bi-bullseye"></i><span>Objetivos</span></a>
      <a href="Perfil.html" class="side-link"><i class="bi bi-person-circle"></i><span>Perfil</span></a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="logout-link" id="btn-logout"><i class="bi bi-box-arrow-left"></i><span>Cerrar sesión</span></a></div>
  </aside>

  <main class="main">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="Rutinas.html" class="text-light fs-4 text-decoration-none d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; background: #151515; border: 1px solid #2a2a2a; border-radius: 10px;">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="mb-0" style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 28px;">Crear rutina</h1>
      </div>
      <button id="btnGuardarRutina" class="btn-lime px-4"><i class="bi bi-check-lg me-1"></i> Guardar</button>
    </div>

    <div class="mb-4" style="max-width: 800px;">
      <label class="form-label fw-semibold text-light mb-2" style="font-size: 15px;">Nombre de la rutina</label>
      <input type="text" id="nombreRutina" class="form-control bg-dark text-light border-secondary py-2" placeholder="Ej: Hipertrofia - Piernas">
    </div>

    <h3 class="mb-3" style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 19px;">Agregar ejercicios</h3>

    <div class="row g-4" style="max-width: 1000px;">
      <div class="col-lg-7">
        <div class="p-3" style="background: #151515; border: 1px solid #2a2a2a; border-radius: 14px; min-height: 380px;">
          
          <div class="position-relative mb-3">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-with"></i>
            <input type="search" id="buscarEjercicio" class="form-control bg-dark text-light border-secondary ps-5 py-2" placeholder="Buscar ejercicio...">
          </div>
          <div id="listaEjerciciosDisponibles" class="d-flex flex-column gap-2" style="max-height: 300px; overflow-y: auto;">
            <div class="text-with text-center py-4">Cargando ejercicios...</div>
          </div>

        </div>
      </div>
      <div class="col-lg-5">
        <div class="p-3 d-flex flex-column justify-content-between" style="background: #151515; border: 1px solid #2a2a2a; border-radius: 14px; height: 100%; min-height: 380px;">
          
          <div>
            <h5 class="mb-3" style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; color: #f4f4f2;">Ejercicios seleccionados</h5>
            <div id="listaEjerciciosSeleccionados" class="d-flex flex-column gap-2" style="max-height: 250px; overflow-y: auto;">
              <div class="text-with text-center py-4 fs-6">No hay ejercicios seleccionados</div>
            </div>
          </div>
          <div class="pt-3 border-top border-secondary mt-3">
            <span id="totalEjercicios" class="fw-semibold text-secondary" style="font-size: 14px;">Total: 0 ejercicios</span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../../JS/api.js"></script>
  <script src="../../../JS/script.js"></script>
  <script src="../../../JS/roles/Socio/crearRutina.js"></script>
<script src="../../../JS/i18n.js"></script>

</html>
