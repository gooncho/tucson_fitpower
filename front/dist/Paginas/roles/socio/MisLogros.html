  <style>
    .logro-card{background:#151515;border:1px solid #343434;border-radius:12px;padding:20px 14px;text-align:center;height:100%;min-height:230px;display:flex;flex-direction:column;align-items:center}
    .logro-icono{width:66px;height:66px;border-radius:50%;background:#242424;border:1px solid #444;display:flex;align-items:center;justify-content:center;color:#cdfa3f;font-size:28px;margin-bottom:14px}
    .logro-card h3{font-size:14px;font-weight:700;margin-bottom:8px;color:#f4f4f2}
    .logro-card p{font-size:12px;color:#aaa;line-height:1.5;margin-bottom:10px}
    .logro-card small{font-size:11px;color:#888;margin-top:auto}
    .logros-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    @media(max-width:1000px){.logros-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.logros-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.logro-card{padding:16px 9px;min-height:220px}}
    @media(max-width:400px){.logros-grid{grid-template-columns:1fr}}
  </style>
</head>
