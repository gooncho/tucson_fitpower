<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel entrenador</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" href="../assets/Icons_logo.png">
  <link rel="stylesheet" href="../../../CSS/dashboard.css">
  <link rel="stylesheet" href="../../../CSS/entrenador.css">
</head>

<body>

  <input type="checkbox" id="menuToggle" class="menu-toggle">
  <label for="menuToggle" class="hamburger-btn" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </label>
  <label for="menuToggle" class="sidebar-overlay"></label>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../../../assets/logo_fitpower.jpg" width="130">
    </div>

   <nav class="nav-group">
      <a href="inicioEntrenador.html" class="side-link active"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a>
      <a href="MisSocios.html" class="side-link"><i class="bi bi-graph-up-arrow"></i><span>Mis socios</span></a>
      <a href="Rutinas.html" class="side-link"><i class="bi bi-list-check"></i><span>Rutinas</span></a>
      <a href="Ejercicios.html" class="side-link"><i class="bi bi-calendar-check"></i><span>Ejercicios</span></a>
      <a href="Perfil.html" class="side-link"><i class="bi bi-person-circle"></i><span>Perfil</span></a>
    </nav>

    <div class="sidebar-footer">
      <a href="#" class="logout-link" id="btn-logout">
        <i class="bi bi-box-arrow-left"></i><span>Cerrar sesión</span>
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="welcome-header">
      <div>
        <h1>¡Hola <span id="nombre-usuario"></span>!</h1>
        <p class="welcome-sub">Resumen entrenamiento</p>
      </div>
    </div>
    <div class="block-heading">Resumen</div>
    <div class="row g-3 mb-4">
      <div class="col-6">
        <div class="metric-card">
          <div class="metric-label">Socios asignados</div>
          <div class="metric-value" id="total-socios">0</div>
          <div class="metric-foot">
            <span><a href="MisSocios.html" class="view-all">socios →</a></span>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="metric-card">
          <div class="metric-label">Rutinas creadas</div>
          <div class="metric-value" id="total-rutinas">0</div>
          <div class="metric-foot">
            <span><a href="Rutinas.html" class="view-all">Ver rutinas →</a></span>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-5">
        <div class="partners-card">
          <div class="partners-header">
            <h2>Mis socios asignados</h2>
            <a href="MisSocios.html" class="view-all">Ver todos →</a>
          </div>
          <div class="partners-list" id="lista-socios-resumen">
            <p>Cargando socios...</p>
          </div>
        </div>
      </div>

      <div class="col-7">
        <div class="routine-card">
          <div class="routine-header">
            <h2>Rutinas creadas</h2>
          </div>
          <table class="routine-table">
            <thead>
              <tr>
                <th>Rutina</th>
                <th>Socio</th>
                <th>Ejercicios</th>
              </tr>
            </thead>
            <tbody id="lista-rutinas-resumen"></tbody>
          </table>
          <div class="routine-foot">
            <a href="Rutinas.html">Ver todas las rutinas →</a>
          </div>
        </div>
      </div>
    </div>

    
  </main>
  
  <script src="../../../JS/api.js"></script>
  <script src="../../../JS/script.js"></script>
  <script src="../../../JS/roles/Entrenador/inicioEntrenador.js"></script>

</body>

</html>
