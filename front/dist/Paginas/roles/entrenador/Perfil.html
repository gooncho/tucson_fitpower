<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Socios</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" href="../../../assets/logo_fitpower.jpg">
  <link rel="stylesheet" href="../../../CSS/dashboard.css">
  <link rel="stylesheet" href="../../../CSS/entrenador.css">
</head>

<body>

  <input type="checkbox" id="menuToggle" class="menu-toggle">
  <label for="menuToggle" class="hamburger-btn" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </label>
  <label for="menuToggle" class="sidebar-overlay"></label>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../../../assets/logo_fitpower.jpg" width="130">
    </div>

    <nav class="nav-group">
      <a href="inicioEntrenador.html" class="side-link"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a>
      <a href="MisSocios.html" class="side-link"><i class="bi bi-graph-up-arrow"></i><span>Mis socios</span></a>
      <a href="Rutinas.html" class="side-link"><i class="bi bi-list-check"></i><span>Rutinas</span></a>
      <a href="Ejercicios.html" class="side-link"><i class="bi bi-calendar-check"></i><span>Ejercicios</span></a>
      <a href="Perfil.html" class="side-link active"><i class="bi bi-person-circle"></i><span>Perfil</span></a>
    </nav>

    <div class="sidebar-footer">
      <a href="#" class="logout-link" id="btn-logout">
        <i class="bi bi-box-arrow-left"></i><span>Cerrar sesión</span>
      </a>
    </div>
  </aside>
  <main class="main">
    <div class="welcome-header">
        <div>
            <h1>Mi perfil</h1>
        </div>
    </div>
    <div class="routine-card">
        <div class="perfil-cabecera">
            <div class="perfil-avatar" id="perfil-avatar">?</div>
            <div class="perfil-identidad">
                <h2 id="perfil-nombre">Cargando...</h2>
                <p id="perfil-email"></p>
            </div>
            <div class="d-flex gap-2">
              <label class="admin-mini" for="perfil-foto-input">Cambiar foto</label>
              <input type="file" id="perfil-foto-input" class="d-none" accept="image/png, image/jpeg, image/webp">
              <button class="admin-mini" id="btn-editar-perfil">Editar perfil</button>
            </div>
        </div>
        <div class="perfil-datos" id="perfil-datos"></div>
        <div class="perfil-sobre">
            <h3>Sobre mí</h3>
            <p id="perfil-sobre-mi"></p>
        </div>
        <p id="perfil-error" class="text-danger small mt-3 mb-0"></p>
    </div>
</main>
  <div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar perfil</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="pf-apellido">Apellido</label>
          <input id="pf-apellido" type="text" class="form-control mb-3" maxlength="50">

          <label class="form-label" for="pf-fecha">Fecha de nacimiento</label>
          <input id="pf-fecha" type="date" class="form-control mb-3">

          <label class="form-label" for="pf-altura">Altura (cm)</label>
          <input id="pf-altura" type="number" class="form-control mb-3" min="50" max="250">

          <div id="pf-especialidad-grupo">
            <label class="form-label" for="pf-especialidad">Especialidad</label>
            <input id="pf-especialidad" type="text" class="form-control mb-3" maxlength="70">
          </div>

          <label class="form-label" for="pf-sobre-mi">Sobre mí</label>
          <textarea id="pf-sobre-mi" class="form-control" rows="3" maxlength="500"></textarea>

          <p id="pf-error" class="text-danger small mt-3 mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn-guardar-perfil" class="admin-btn">Guardar</button>
        </div>
      </div>
    </div>
  </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../../JS/api.js"></script>
  <script src="../../../JS/script.js"></script>
  <script src="../../../JS/perfil.js"></script>
<script src="../../../JS/i18n.js"></script>
</body>

</html>
