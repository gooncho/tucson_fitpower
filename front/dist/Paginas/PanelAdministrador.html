<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="admin-body">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="admin-sidebar col-md-2 p-3 d-none d-md-block ">
                    <div class="text-center mb-4">
                        <img src="../assets/logo_fitpower.jpg" class="admin-logo">
                    </div>
                    <nav class="nav flex-column">
                        <a href="#" class="nav-link admin-link activo"><i class="bi bi-house"></i>Inicio</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-people"></i>Socios</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-card-checklist"></i>Membresías</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-person-badge"></i>Entrenadores</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-cash-stack"></i>Pagos e ingresos</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-box"></i>Productos</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-activity"></i>Ejercicios</a>
                        <a href="#" class="nav-link admin-link"><i class="bi bi-person-circle"></i>Perfil</a>
                    </nav>
                    <hr>
                    <a href="#" class="nav-link admin-link"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a>
            </aside>
            <main class="col-md-10 admin-contenido">
                <div class="admin-header">
                    <div>
                        <h1>¡Hola...!</h1>
                        <p>Resumen del sistema</p>
                    </div>
                    <img src="../assets/logo_fitpower.jpg" class="admin-logo">
                </div>
                <section class="admin-seccion">
                    <h3>Resumen</h3>
                    <div class="row g-3">
                        <div class="col-sm-6 col-xl-3">
                            <div class="admin-card">
                                <small>Socios registrados</small>
                                <h2>356</h2>
                                <span>+12 este mes</span>
                                <i class="bi bi-people"></i>
                            </div>
                        </div>
                        <div class="col-sm-6 col-xl-3">
                            <div class="admin-card">
                                <small>Entrenadores disponibles</small>
                                <h2>8</h2>
                                <span>+0 este mes</span>
                                <i class="bi bi-person-badge"></i>
                            </div>
                        </div>
                        <div class="col-sm-6 col-xl-3">
                            <div class="admin-card">
                                <small>Membresías activas</small>
                                <h2>202</h2>
                                <span>-2 este mes</span>
                                <i class="bi bi-card-checklist"></i>
                            </div>
                        </div>
                        <div class="col-sm-6 col-xl-3">
                            <div class="admin-card">
                                <small>Ingresos este mes</small>
                                <h2>$45.230</h2>
                                <span>+15% este mes</span>
                                <i class="bi bi-cash-stack"></i>
                            </div>
                        </div>
                    </div>
                </section>
            
            </main>
            </body>

</html>
